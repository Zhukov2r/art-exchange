
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ART EXCHANGE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --gold: #d6b46a;
  --bg: #090909;
  --panel: #151515;
  --muted: #929292;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: #fff;
  font-family: Arial, sans-serif;
}
header {
  padding: 24px 18px;
  border-bottom: 1px solid #292929;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  color: var(--gold);
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 2px;
}
header span { color: #aaa; font-size: 11px; }
main { padding: 18px; max-width: 700px; margin: auto; }
.hero { padding: 24px 0; }
h1 { font-size: 29px; margin: 0 0 10px; }
h1 em { color: var(--gold); font-style: normal; }
.muted { color: var(--muted); font-size: 13px; line-height: 1.5; }
.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}
button {
  cursor: pointer;
  border: 1px solid #3a3325;
  border-radius: 10px;
  padding: 13px 16px;
  background: #171717;
  color: white;
  font-size: 14px;
}
button.active, .primary {
  background: var(--gold);
  color: #111;
  border-color: var(--gold);
  font-weight: bold;
}
button:disabled { opacity: .5; }
.panel {
  background: var(--panel);
  border: 1px solid #292929;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 18px;
}
input, textarea {
  width: 100%;
  background: #0c0c0c;
  border: 1px solid #383838;
  border-radius: 9px;
  padding: 13px;
  margin: 8px 0 15px;
  color: white;
  font-size: 15px;
}
textarea { min-height: 85px; resize: vertical; }
label { font-size: 13px; color: #ccc; }
.upload {
  display: block;
  border: 1px dashed #76613a;
  border-radius: 10px;
  padding: 22px;
  text-align: center;
  color: var(--gold);
  margin: 10px 0 15px;
}
.upload input { display: none; }
.preview {
  width: 100%;
  max-height: 260px;
  object-fit: contain;
  border-radius: 10px;
  display: none;
  margin: 10px 0;
  background: #080808;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.art {
  overflow: hidden;
  background: var(--panel);
  border: 1px solid #292929;
  border-radius: 12px;
}
.art img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #222;
}
.art-info { padding: 11px; }
.art-title {
  font-weight: bold;
  font-size: 14px;
  overflow-wrap: anywhere;
}
.art-desc {
  color: #999;
  font-size: 11px;
  margin-top: 6px;
  overflow-wrap: anywhere;
}
.price {
  color: var(--gold);
  margin-top: 10px;
  font-weight: bold;
  font-size: 13px;
}
.status {
  font-size: 12px;
  color: var(--gold);
  min-height: 18px;
  margin: 12px 0;
}
.section-title {
  font-size: 18px;
  margin: 25px 0 14px;
}
.hidden { display: none !important; }
footer {
  text-align: center;
  color: #555;
  padding: 30px 10px;
  font-size: 11px;
}
</style>
</head>
<body>

<header>
  <div class="logo">ART EXCHANGE</div>
  <span> DIGITAL ART MARKET</span>
</header>

<main>
  <section class="hero">
    <h1>Искусство имеет <em>ценность.</em></h1>
    <div class="muted">
      Создавай цифровые произведения, публикуй их
      и находи новых владельцев.
    </div>
  </section>

  <div class="tabs">
    <button id="catalogTab" class="active">Каталог</button>
    <button id="createTab">Создать картину</button>
  </div>

  <section id="catalogSection">
    <div class="section-title">Последние работы</div>
    <div id="catalog" class="grid"></div>
    <div id="catalogStatus" class="status">Загружаем каталог...</div>
    <button id="refreshButton">Обновить каталог</button>
  </section>

  <section id="createSection" class="hidden">
    <div class="section-title">Новая работа</div>
    <div class="panel">
      <label>Название картины</label>
      <input id="title" maxlength="100" placeholder="Название произведения">

      <label>Описание</label>
      <textarea id="description" maxlength="2000" placeholder="Расскажи о своей работе"></textarea>

      <label>Цена в Telegram Stars</label>
      <input id="price" type="number" min="1" step="1" placeholder="Например, 100">

      <label class="upload" for="image">
        + Выбрать изображение
        <div class="muted">JPG, PNG или WEBP</div>
        <input id="image" type="file" accept="image/jpeg,image/png,image/webp">
      </label>

      <img id="preview" class="preview" alt="Предпросмотр картины">

      <div id="createStatus" class="status"></div>
      <button id="publishButton" class="primary" style="width:100%">
        Опубликовать картину
      </button>
    </div>
  </section>
</main>

<footer>ART EXCHANGE · DIGITAL OWNERSHIP</footer>

<script>
const API_URL = "https://mbdysnbmjfmdshdhwzyh.supabase.co/functions/v1/art-api";
const SUPABASE_KEY = "sb_publishable_vG3SZnBwk4L2BjUAtVKV6g_iAIuZ-wx";

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

const initData = tg?.initData || "";

const catalog = document.getElementById("catalog");
const catalogStatus = document.getElementById("catalogStatus");
const createStatus = document.getElementById("createStatus");
const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");

let selectedImage = null;

async function apiRequest(data) {
  if (!initData) {
    throw new Error("Открой приложение через Telegram-бота.");
  }

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify({
      ...data,
      initData
    })
  });

  const result = await res.json();

  if (!res.ok || result.error) {
    throw new Error(result.error || "Ошибка сервера");
  }

  return result;
}

function showSection(section) {
  document.getElementById("catalogSection").classList.toggle("hidden", section !== "catalog");
  document.getElementById("createSection").classList.toggle("hidden", section !== "create");
  document.getElementById("catalogTab").classList.toggle("active", section === "catalog");
  document.getElementById("createTab").classList.toggle("active", section === "create");
}

document.getElementById("catalogTab").onclick = () => showSection("catalog");
document.getElementById("createTab").onclick = () => showSection("create");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

async function loadCatalog() {
  catalogStatus.textContent = "Загружаем каталог...";
  catalog.innerHTML = "";

  try {
    const result = await apiRequest({ action: "list" });
    const artworks = result.artworks || [];

    if (!artworks.length) {
      catalogStatus.textContent = "Пока картин нет. Будь первым автором!";
      return;
    }

    for (const item of artworks) {
      const card = document.createElement("article");
      card.className = "art";

      const img = document.createElement("img");
      img.src = item.image_url;
      img.alt = item.title || "Картина";
      img.loading = "lazy";

      const info = document.createElement("div");
      info.className = "art-info";

      const title = document.createElement("div");
      title.className = "art-title";
      title.textContent = item.title || "Без названия";

      const desc = document.createElement("div");
      desc.className = "art-desc";
      desc.textContent = item.description || "";

      const price = document.createElement("div");
      price.className = "price";
      price.textContent = `${item.price_stars} ⭐`;

      info.append(title, desc, price);
      card.append(img, info);
      catalog.append(card);
    }

    catalogStatus.textContent = `Работ в каталоге: ${artworks.length}`;
  } catch (error) {
    catalogStatus.textContent = error.message;
  }
}

document.getElementById("refreshButton").onclick = loadCatalog;

imageInput.onchange = async () => {
  const file = imageInput.files?.[0];
  selectedImage = null;
  preview.style.display = "none";

  if (!file) return;

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    createStatus.textContent = "Выбери JPG, PNG или WEBP.";
    imageInput.value = "";
    return;
  }

  try {
    createStatus.textContent = "Подготавливаем изображение...";

    const image = await createImageBitmap(file);
    const maxSide = 1800;
    const scale = Math.min(1, maxSide / Math.max(image.width, image.height));

    const canvas = document.createElement("canvas");
    canvas.width = Math.round(image.width * scale);
    canvas.height = Math.round(image.height * scale);

    const ctx = canvas.getContext("2d");
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise(resolve =>
      canvas.toBlob(resolve, "image/jpeg", 0.82)
    );

    if (!blob) throw new Error("Не удалось обработать изображение.");

    if (blob.size > 5 * 1024 * 1024) {
      throw new Error("Изображение слишком большое.");
    }

    const reader = new FileReader();

    reader.onload = () => {
      selectedImage = reader.result;
      preview.src = reader.result;
      preview.style.display = "block";
      createStatus.textContent = "Изображение готово к публикации.";
    };

    reader.onerror = () => {
      createStatus.textContent = "Не удалось прочитать изображение.";
    };

    reader.readAsDataURL(blob);
  } catch (error) {
    createStatus.textContent = error.message;
    selectedImage = null;
  }
};

document.getElementById("publishButton").onclick = async () => {
  const button = document.getElementById("publishButton");
  const title = document.getElementById("title").value.trim();
  const description = document.getElementById("description").value.trim();
  const price = Number(document.getElementById("price").value);

  if (!title) {
    createStatus.textContent = "Введи название картины.";
    return;
  }

  if (!Number.isSafeInteger(price) || price < 1) {
    createStatus.textContent = "Укажи цену не меньше 1 Star.";
    return;
  }

  if (!selectedImage) {
    createStatus.textContent = "Сначала выбери изображение.";
    return;
  }

  button.disabled = true;
  button.textContent = "Публикуем...";
  createStatus.textContent = "Отправляем картину на сервер...";

  try {
    await apiRequest({
      action: "create",
      title,
      description,
      priceStars: price,
      contentType: "image/jpeg",
      imageBase64: selectedImage
    });

    createStatus.textContent = "Картина опубликована!";
    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("price").value = "";
    imageInput.value = "";
    selectedImage = null;
    preview.style.display = "none";

    showSection("catalog");
    await loadCatalog();
  } catch (error) {
    createStatus.textContent = "Ошибка: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Опубликовать картину";
  }
};

loadCatalog();
</script>
</body>
</html>
